<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Quick check, openseat</title>
<style>
  :root { color-scheme: light dark; --bg: #f3f3f1; --ink: #14201b; --muted: #5d6b65; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1513; --ink: #e8eeeb; --muted: #9aa8a2; } }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; text-align: center; }
  p { margin: 0; max-width: 32ch; color: var(--muted); }
</style>
</head>
<body>
<p id="msg">One quick check that you are not a robot.</p>
<div id="box"></div>
<script>
/*
 * Bot check for the openseat apps. The app opens this page in an in-app
 * browser with ?k=<site key>&to=<app link>&lang=<language code>, and the page sends
 * the Turnstile token back to the app. Only app links are allowed as the
 * destination, so a token can never be sent to another website.
 */
(function () {
  var q = new URLSearchParams(location.search);
  var key = q.get('k') || '';
  var to = q.get('to') || '';
  /* Each language's two messages and text direction, filled in from the lang folder (botCheck) by vite.config.ts. */
  var texts = __OPENSEAT_BOT_CHECK__;
  var lang = texts.hasOwnProperty(q.get('lang')) ? q.get('lang') : 'en';
  var text = texts[lang];
  var msg = document.getElementById('msg');
  document.documentElement.lang = lang;
  document.documentElement.dir = text.dir;
  msg.textContent = text.ask;
  var allowed = /^(openseat|exp|exps):\/\//.test(to);
  if (!key || !allowed) {
    msg.textContent = text.invalid;
    return;
  }
  var back = function (params) {
    location.replace(to + (to.indexOf('?') < 0 ? '?' : '&') + new URLSearchParams(params));
  };
  window.onTurnstileLoad = function () {
    window.turnstile.render('#box', {
      sitekey: key,
      language: lang,
      callback: function (token) { back({ token: token }); },
      'error-callback': function () { back({ error: '1' }); },
    });
  };
  var s = document.createElement('script');
  s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad';
  s.async = true;
  s.onerror = function () { back({ error: '1' }); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
